<script>const D={"id": "ve360ffda03", "date": "2026-10-11", "level": "hard", "qs": [{"id": "obstreperous", "type": "word", "q": "obstreperous", "ans": "noisy and difficult to control", "d": ["polite and considerate", "wealthy and generous", "weak and pale"], "exp": "Meaning: noisy and difficult to control\nExample: The obstreperous crowd kept interrupting the speaker.", "o": ["weak and pale", "wealthy and generous", "noisy and difficult to control", "polite and considerate"], "a": 2}, {"id": "impecunious", "type": "word", "q": "impecunious", "ans": "having very little or no money", "d": ["having unlimited knowledge", "having great wealth", "having unusual strength"], "exp": "Meaning: having very little or no money\nExample: The impecunious student borrowed the textbook from the library.", "o": ["having very little or no money", "having great wealth", "having unlimited knowledge", "having unusual strength"], "a": 0}, {"id": "bibulous", "type": "word", "q": "bibulous", "ans": "fond of drinking alcoholic beverages", "d": ["afraid of large crowds", "fond of reading quietly", "eager to save money"], "exp": "Meaning: fond of drinking alcoholic beverages\nExample: The novel portrays a bibulous landlord who spends evenings at the tavern.", "o": ["eager to save money", "fond of reading quietly", "afraid of large crowds", "fond of drinking alcoholic beverages"], "a": 3}, {"id": "obsequies", "type": "word", "q": "obsequies", "ans": "funeral ceremonies", "d": ["horse-riding contests", "eager flattery", "noisy protests"], "exp": "Meaning: funeral ceremonies\nExample: The family held quiet obsequies for their grandfather.", "o": ["horse-riding contests", "funeral ceremonies", "noisy protests", "eager flattery"], "a": 1}, {"id": "pecuniary", "type": "word", "q": "pecuniary", "ans": "relating to money", "d": ["relating to funeral rites", "relating to horses", "relating to speech sounds"], "exp": "Meaning: relating to money\nExample: The agreement listed his pecuniary obligations.", "o": ["relating to speech sounds", "relating to funeral rites", "relating to money", "relating to horses"], "a": 2}, {"id": "imbibe", "type": "word", "q": "imbibe", "ans": "to drink or take in", "d": ["to speak arrogantly", "to ride in a procession", "to give up a claim"], "exp": "Meaning: to drink or take in\nExample: The travellers stopped to imbibe some cool water.", "o": ["to drink or take in", "to ride in a procession", "to give up a claim", "to speak arrogantly"], "a": 0}, {"id": "dolor", "type": "word", "q": "dolor", "ans": "sorrow or grief", "d": ["careless confidence", "great wealth", "unlimited power"], "exp": "Meaning: sorrow or grief\nExample: The poem expresses the dolor of losing a friend.", "o": ["careless confidence", "unlimited power", "great wealth", "sorrow or grief"], "a": 3}, {"id": "doleful", "type": "word", "q": "doleful", "ans": "sad and mournful", "d": ["noisy and unruly", "wealthy and generous", "eager to flatter"], "exp": "Meaning: sad and mournful\nExample: The violin played a doleful tune.", "o": ["noisy and unruly", "sad and mournful", "eager to flatter", "wealthy and generous"], "a": 1}, {"id": "cavalcade", "type": "word", "q": "cavalcade", "ans": "a procession of riders or vehicles", "d": ["a funeral speech", "a brief period of happiness", "a chemical poison"], "exp": "Meaning: a procession of riders or vehicles\nExample: A cavalcade of cars followed the parade route.", "o": ["a funeral speech", "a chemical poison", "a procession of riders or vehicles", "a brief period of happiness"], "a": 2}, {"id": "condole", "type": "word", "q": "condole", "ans": "to express sympathy for a loss", "d": ["to offer congratulations", "to deny a statement", "to cause loud disorder"], "exp": "Meaning: to express sympathy for a loss\nExample: Neighbours came to condole with the grieving family.", "o": ["to deny a statement", "to cause loud disorder", "to offer congratulations", "to express sympathy for a loss"], "a": 3}, {"id": "VG001", "type": "grammar", "q": "Choose the sentence with correct subject-verb agreement.", "ans": "Each of the books is useful.", "d": ["Each of the books are useful.", "Each of the books have been useful.", "Each of the books were useful."], "exp": "Each refers to one item at a time and takes a singular verb. The plural noun books does not change the subject: Each is useful.", "src": "Cambridge English Grammar, checked 11 October 2026", "url": "https://dictionary.cambridge.org/grammar/british-grammar/each", "o": ["Each of the books is useful.", "Each of the books were useful.", "Each of the books are useful.", "Each of the books have been useful."], "a": 0}, {"id": "VG002", "type": "grammar", "q": "Choose the sentence that correctly describes a situation that began in 2020 and continues now.", "ans": "She has lived here since 2020.", "d": ["She has lived here for 2020.", "She have lived here since 2020.", "She has living here since 2020."], "exp": "Since introduces a starting point, such as 2020. Has lived uses the present perfect for a situation that continues now.", "src": "Cambridge English Grammar, checked 11 October 2026", "url": "https://dictionary.cambridge.org/grammar/british-grammar/for-or-since", "o": ["She has lived here for 2020.", "She has lived here since 2020.", "She have lived here since 2020.", "She has living here since 2020."], "a": 1}, {"id": "VP001", "type": "ordering", "q": "Choose the most coherent order. A. This shoot soon grew into a leafy plant. B. Mira planted a seed in a pot. C. A week later, a green shoot appeared. D. After planting it, she watered the pot each morning.", "ans": "B-D-C-A", "d": ["A-B-C-D", "C-A-D-B", "D-C-B-A"], "exp": "B introduces the seed. D follows planting and describes watering. C introduces the shoot a week later. A refers back to this shoot, so it follows C.", "src": "Original item, coherence checked 11 October 2026", "url": "", "o": ["D-C-B-A", "A-B-C-D", "B-D-C-A", "C-A-D-B"], "a": 2}]};const L="ABCD";const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+(q.type=="word"?"Book word":q.type=="grammar"?"Grammar":"Sentence order")+'</span><br><b>'+(i+1)+'. '+esc(q.q)+'</b>'+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+'. '+esc(o)+'</label>').join("");document.getElementById("qs").appendChild(d)});
document.getElementById("sub").onclick=()=>{const missing=D.qs.map((q,i)=>document.querySelector('input[name=q'+i+']:checked')?0:i+1).filter(x=>x);if(missing.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+missing.join(", ");return}document.getElementById("warn").textContent="";let total=0,answers="",scores={word:0,grammar:0,ordering:0},review="";D.qs.forEach((q,i)=>{const v=+document.querySelector('input[name=q'+i+']:checked').value;answers+=L[v];const ok=v===q.a;if(ok){total++;scores[q.type]++}review+='<div class="q"><b>'+(i+1)+'. '+esc(q.q)+'</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+'. '+esc(q.o[q.a])+'<div class="ex">'+esc(q.exp)+'</div></div>'});document.getElementById("score").textContent="Score: "+total+"/13";document.getElementById("sections").textContent="Book words: "+scores.word+"/10; Grammar: "+scores.grammar+"/2; Sentence order: "+scores.ordering+"/1";document.getElementById("rev").innerHTML=review;document.getElementById("code").textContent="VOC2|"+D.id+"|"+D.level+"|"+total+"/13|"+answers+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true};
